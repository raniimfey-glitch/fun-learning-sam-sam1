<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="mStar512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>
  <!-- Full-bleed background for maskable canvas -->
  <rect width="512" height="512" fill="url(#mGrad512)"/>
  <circle cx="256" cy="270" r="145" fill="#ffffff" fill-opacity="0.12"/>
  <!-- Open Book -->
  <g>
    <!-- Left Page -->
    <path d="M 140 215 Q 198 198 246 222 L 246 350 Q 198 325 140 342 Z" fill="#FFFFFF"/>
    <!-- Right Page -->
    <path d="M 372 215 Q 314 198 266 222 L 266 350 Q 314 325 372 342 Z" fill="#FFFFFF"/>
    <!-- Lines on Left Page -->
    <line x1="160" y1="248" x2="225" y2="240" stroke="#0284C7" stroke-width="5" stroke-linecap="round"/>
    <line x1="160" y1="278" x2="225" y2="270" stroke="#0284C7" stroke-width="5" stroke-linecap="round"/>
    <!-- Lines on Right Page -->
    <line x1="287" y1="240" x2="352" y2="248" stroke="#0284C7" stroke-width="5" stroke-linecap="round"/>
    <line x1="287" y1="270" x2="352" y2="278" stroke="#0284C7" stroke-width="5" stroke-linecap="round"/>
    <!-- Bookmark Ribbon -->
    <path d="M 250 205 L 262 205 L 262 370 L 256 362 L 250 370 Z" fill="#EF4444"/>
  </g>
  <!-- Shining Star -->
  <g transform="translate(256, 160)">
    <polygon points="0,-36 10,-11 36,-11 15,5 23,30 0,15 -23,30 -15,5 -36,-11 -10,-11" fill="url(#mStar512)"/>
    <circle cx="0" cy="0" r="6" fill="#FFFBEB"/>
  </g>
</svg>
